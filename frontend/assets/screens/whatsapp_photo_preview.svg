<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" height="100%" style="background:#0b141a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- WhatsApp Photo Preview Screen -->
  <!-- Top Bar -->
  <rect x="0" y="0" width="400" height="75" fill="rgba(0,0,0,0.6)"/>
  <path d="M 24 38 L 36 26 M 24 38 L 36 50 M 24 38 L 44 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Editing Tools (Crop, Sticker, Text, Pencil) -->
  <rect x="250" y="28" width="20" height="20" rx="3" stroke="#ffffff" stroke-width="2" fill="none"/>
  <circle cx="295" cy="38" r="9" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="335" y="44" fill="#ffffff" font-size="18" font-weight="bold">T</text>
  <path d="M 370 28 L 380 38 L 368 50 L 358 40 Z" fill="#ffffff"/>

  <!-- Photo Centerpiece (Family / Scenery Photo) -->
  <rect x="15" y="85" width="370" height="520" rx="16" fill="#1e293b"/>
  <!-- Scenery Illustration inside photo -->
  <circle cx="200" cy="260" r="60" fill="#f59e0b" opacity="0.8"/>
  <polygon points="50,480 180,320 280,480" fill="#334155"/>
  <polygon points="170,480 270,360 370,480" fill="#475569"/>
  <rect x="15" y="460" width="370" height="145" fill="#15803d" opacity="0.6" rx="0 0 16 16"/>
  <text x="200" y="540" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">તમારો પસંદ કરેલો ફોટો (Selected Photo)</text>

  <!-- Bottom Caption Capsule -->
  <rect x="15" y="625" width="300" height="50" rx="25" fill="#1f2c34"/>
  <circle cx="40" cy="650" r="10" stroke="#8696a0" stroke-width="2" fill="none"/>
  <text x="65" y="656" fill="#8696a0" font-size="15">Add a caption...</text>

  <!-- Recipient Chip -->
  <rect x="15" y="688" width="180" height="34" rx="17" fill="#1f2c34"/>
  <text x="30" y="710" fill="#aebac1" font-size="13">Ramesh Patel (Brother)</text>

  <!-- Floating Green Send Button (TARGET FOR PHOTO SEND) -->
  <g id="photo_send_btn">
    <circle cx="355" cy="670" r="30" fill="#00a884" filter="drop-shadow(0px 6px 10px rgba(0,0,0,0.5))"/>
    <path d="M 345 656 L 371 670 L 345 684 L 351 670 Z" fill="#ffffff"/>
  </g>
</svg>

