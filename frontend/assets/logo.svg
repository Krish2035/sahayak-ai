<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sahayakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a884"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Green Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#sahayakGrad)" filter="url(#dropShadow)"/>
  <!-- Bold White S in Center -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="300" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
</svg>