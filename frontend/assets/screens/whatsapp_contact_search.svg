<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" height="100%" style="background:#111b21; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- WhatsApp Contact Search Screen -->
  <!-- Top Bar with Search Input -->
  <rect x="0" y="0" width="400" height="85" fill="#202c33"/>
  <path d="M 24 42 L 36 30 M 24 42 L 36 54 M 24 42 L 44 42" stroke="#aebac1" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Search Input Field -->
  <rect x="60" y="20" width="280" height="46" rx="23" fill="#111b21"/>
  <circle cx="82" cy="43" r="6" stroke="#8696a0" stroke-width="1.8" fill="none"/>
  <text x="100" y="48" fill="#e9edef" font-size="16">Dr. Mehta</text>
  <!-- Blinking Cursor -->
  <line x1="175" y1="34" x2="175" y2="52" stroke="#00a884" stroke-width="2"/>
  <!-- Clear X button -->
  <circle cx="318" cy="43" r="10" fill="#202c33"/>
  <text x="318" y="48" fill="#8696a0" font-size="13" font-weight="bold" text-anchor="middle">×</text>

  <!-- Contacts Matching Search Result Header -->
  <text x="24" y="118" fill="#8696a0" font-size="13" font-weight="bold">SEARCH RESULT</text>

  <!-- TARGET CONTACT ITEM: Dr. Mehta Clinic (TARGET FOR STEP 5) -->
  <g id="search_result_contact">
    <rect x="0" y="135" width="400" height="85" fill="#182229"/>
    <!-- Avatar -->
    <circle cx="48" cy="177" r="24" fill="#007aff"/>
    <text x="48" y="185" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">D</text>
    <!-- Contact Info -->
    <text x="88" y="170" fill="#00a884" font-size="17" font-weight="700">Dr. Mehta Clinic</text>
    <text x="88" y="192" fill="#8696a0" font-size="14">+91 98250 12345 (Mobile)</text>
    <!-- Radio / Check Circle on right -->
    <circle cx="360" cy="177" r="12" stroke="#00a884" stroke-width="2" fill="none"/>
    <circle cx="360" cy="177" r="6" fill="#00a884"/>
    <line x1="88" y1="220" x2="400" y2="220" stroke="#222d34" stroke-width="1"/>
  </g>

  <!-- Second Contact Result for realism -->
  <circle cx="48" cy="265" r="24" fill="#64748b"/>
  <text x="48" y="273" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle">M</text>
  <text x="88" y="258" fill="#e9edef" font-size="16" font-weight="500">Mehtaji Accountant</text>
  <text x="88" y="280" fill="#8696a0" font-size="14">+91 94260 11223 (Work)</text>
  <line x1="88" y1="308" x2="400" y2="308" stroke="#222d34" stroke-width="1"/>

  <!-- Keyboard Mockup at bottom -->
  <rect x="0" y="440" width="400" height="310" fill="#1e2227"/>
  <text x="200" y="475" fill="#8696a0" font-size="13" text-anchor="middle">ENGLISH (IN) KEYBOARD</text>
  <!-- Mock Key Rows -->
  <rect x="15" y="495" width="370" height="36" rx="6" fill="#2d3239"/>
  <rect x="25" y="540" width="350" height="36" rx="6" fill="#2d3239"/>
  <rect x="45" y="585" width="310" height="36" rx="6" fill="#2d3239"/>
  <!-- Space Bar & Search Key -->
  <rect x="100" y="635" width="200" height="42" rx="8" fill="#383e47"/>
  <rect x="315" y="635" width="70" height="42" rx="8" fill="#00a884"/>
  <text x="350" y="661" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Done</text>
</svg>

