<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" height="100%" style="background:#000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Google Pay QR Scanner Screen -->
  <!-- Top Bar -->
  <rect x="0" y="0" width="400" height="75" fill="rgba(0,0,0,0.7)"/>
  <path d="M 24 38 L 36 26 M 24 38 L 36 50 M 24 38 L 44 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="64" y="44" fill="#ffffff" font-size="18" font-weight="600">Scan any QR code</text>
  <!-- Flashlight Icon -->
  <circle cx="350" cy="38" r="16" fill="#2d2d2d"/>
  <path d="M 346 32 L 354 32 L 356 38 L 344 38 Z" fill="#ffffff"/>
  <rect x="348" y="38" width="4" height="8" fill="#ffffff"/>

  <!-- Camera Viewfinder Background -->
  <rect x="0" y="75" width="400" height="580" fill="#18181b"/>

  <!-- Shop Stand Illustration in Viewfinder -->
  <rect x="110" y="220" width="180" height="230" rx="10" fill="#ffffff"/>
  <!-- Stand Header (Paytm / UPI / GPay) -->
  <rect x="110" y="220" width="180" height="40" rx="10 10 0 0" fill="#002e6e"/>
  <text x="200" y="246" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">Accepted Here</text>
  <!-- QR Code Mock Pattern -->
  <rect x="135" y="275" width="130" height="130" fill="#ffffff"/>
  <rect x="140" y="280" width="30" height="30" fill="#000000"/>
  <rect x="145" y="285" width="20" height="20" fill="#ffffff"/>
  <rect x="150" y="290" width="10" height="10" fill="#000000"/>
  
  <rect x="230" y="280" width="30" height="30" fill="#000000"/>
  <rect x="235" y="285" width="20" height="20" fill="#ffffff"/>
  <rect x="240" y="290" width="10" height="10" fill="#000000"/>

  <rect x="140" y="370" width="30" height="30" fill="#000000"/>
  <rect x="145" y="375" width="20" height="20" fill="#ffffff"/>
  <rect x="150" y="380" width="10" height="10" fill="#000000"/>

  <!-- Scanning Reticle Frame (TARGET HIGHLIGHT) -->
  <g id="scanner_frame" stroke="#34d399" stroke-width="4" fill="none">
    <!-- Top-Left Corner -->
    <path d="M 80 230 L 60 230 L 60 250" stroke-linecap="round"/>
    <!-- Top-Right Corner -->
    <path d="M 320 230 L 340 230 L 340 250" stroke-linecap="round"/>
    <!-- Bottom-Left Corner -->
    <path d="M 60 450 L 60 470 L 80 470" stroke-linecap="round"/>
    <!-- Bottom-Right Corner -->
    <path d="M 340 450 L 340 470 L 320 470" stroke-linecap="round"/>
    <!-- Center Laser Line Animation Hint -->
    <line x1="70" y1="350" x2="330" y2="350" stroke="#ef4444" stroke-width="2.5" opacity="0.8"/>
  </g>

  <!-- Helpful Instruction Tip in Viewfinder -->
  <rect x="60" y="520" width="280" height="42" rx="21" fill="rgba(0,0,0,0.65)"/>
  <text x="200" y="546" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Point camera at shop's QR code</text>

  <!-- Bottom Bar: Upload from Gallery -->
  <rect x="0" y="655" width="400" height="95" fill="#18181b"/>
  <circle cx="200" cy="700" r="26" fill="#27272a"/>
  <rect x="188" y="690" width="24" height="20" rx="3" stroke="#ffffff" stroke-width="2" fill="none"/>
  <circle cx="194" cy="696" r="2.5" fill="#ffffff"/>
  <text x="200" y="740" fill="#a1a1aa" font-size="12" text-anchor="middle">Upload from gallery</text>
</svg>

