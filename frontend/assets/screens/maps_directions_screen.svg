<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" height="100%" style="background:#1a2327; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Google Maps Canvas Background Grid -->
  <rect x="0" y="0" width="400" height="750" fill="#1e2930"/>
  
  <!-- Stylized Map Roads -->
  <path d="M -20 150 Q 150 180 200 320 T 420 400" stroke="#334756" stroke-width="26" fill="none"/>
  <path d="M 200 0 L 200 750" stroke="#2c3e50" stroke-width="18" fill="none"/>
  <path d="M 0 350 L 400 350" stroke="#2c3e50" stroke-width="14" fill="none"/>
  
  <!-- Active Blue Route to Home -->
  <path d="M 120 480 Q 160 380 200 320 T 260 210" stroke="#1a73e8" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 120 480 Q 160 380 200 320 T 260 210" stroke="#8ab4f8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Start Pin (Current Location) -->
  <circle cx="120" cy="480" r="16" fill="#1a73e8" stroke="#ffffff" stroke-width="3"/>
  <circle cx="120" cy="480" r="6" fill="#ffffff"/>
  
  <!-- Home Destination Pin (TARGET x: 65%, y: 28%) -->
  <circle cx="260" cy="210" r="22" fill="#ea4335" stroke="#ffffff" stroke-width="3"/>
  <text x="260" y="218" font-size="16" text-anchor="middle">🏠</text>
  <rect x="220" y="155" width="80" height="28" rx="14" fill="#ffffff"/>
  <text x="260" y="174" fill="#202124" font-size="13" font-weight="bold" text-anchor="middle">મારું ઘર</text>

  <!-- Top Search Card -->
  <rect x="16" y="20" width="368" height="52" rx="26" fill="#202124" stroke="#3c4043" stroke-width="1"/>
  <text x="40" y="52" font-size="18">🔍</text>
  <text x="70" y="52" fill="#ffffff" font-size="16" font-weight="700">ઘર (Home) નો રસ્તો</text>
  <circle cx="350" cy="46" r="16" fill="#1a73e8"/>
  <text x="350" y="52" font-size="14" text-anchor="middle">🎙️</text>

  <!-- BOTTOM NAVIGATION CARD -->
  <rect x="0" y="530" width="400" height="220" fill="#202124" rx="28" filter="drop-shadow(0 -4px 20px rgba(0,0,0,0.6))"/>
  
  <!-- Time & Distance -->
  <text x="24" y="575" fill="#34a853" font-size="28" font-weight="800">14 મિનિટ</text>
  <text x="145" y="575" fill="#9aa0a6" font-size="17" font-weight="600">• 4.2 કિ.મી.</text>
  <text x="24" y="605" fill="#e8eaed" font-size="15">ટ્રાફિક બહુ ઓછો છે • સૌથી ઝડપી રસ્તો</text>

  <!-- Route steps preview -->
  <rect x="24" y="620" width="352" height="36" rx="10" fill="#2d2e30"/>
  <text x="36" y="643" fill="#8ab4f8" font-size="14" font-weight="bold">↖️ આગળથી ડાબી બાજુ વળો (Turn Left)</text>

  <!-- ACTION BUTTONS: START VOICE NAVIGATION (TARGET x: 70%, y: 90%) -->
  <rect x="24" y="670" width="130" height="52" rx="26" fill="#3c4043"/>
  <text x="40" y="702" font-size="18">🚗</text>
  <text x="65" y="702" fill="#ffffff" font-size="15" font-weight="bold">રૂટ વિગત</text>

  <!-- TARGET ACTION: BLUE START BUTTON ↗️ -->
  <g id="start_nav_btn">
    <rect x="170" y="670" width="206" height="52" rx="26" fill="#1a73e8"/>
    <circle cx="198" cy="696" r="14" fill="#ffffff"/>
    <path d="M 194 696 L 202 696 M 198 692 L 202 696 L 198 700" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round"/>
    <text x="222" y="702" fill="#ffffff" font-size="17" font-weight="800">શરૂ કરો (Start) ↗️</text>
  </g>
</svg>
