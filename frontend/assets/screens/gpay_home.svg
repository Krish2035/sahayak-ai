<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" height="100%" style="background:#1f1f1f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Google Pay Top Bar -->
  <rect x="0" y="0" width="400" height="75" fill="#1f1f1f"/>
  <circle cx="36" cy="38" r="18" fill="#4285f4"/>
  <text x="36" y="44" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">G</text>
  <rect x="70" y="20" width="260" height="38" rx="19" fill="#2d2d2d"/>
  <circle cx="88" cy="38" r="6" stroke="#9aa0a6" stroke-width="1.8" fill="none"/>
  <text x="105" y="43" fill="#9aa0a6" font-size="14">Pay friends and merchants</text>
  <circle cx="362" cy="38" r="16" fill="#e8710a"/>
  <text x="362" y="44" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">D</text>

  <!-- Banner / GPay Graphic -->
  <rect x="20" y="85" width="360" height="120" rx="16" fill="#132d4b"/>
  <text x="40" y="125" fill="#ffffff" font-size="19" font-weight="700">Scan &amp; Pay at any shop</text>
  <text x="40" y="148" fill="#a8c7fa" font-size="14">Instant payment to all QR codes</text>
  <circle cx="330" cy="145" r="30" fill="#0b57d0"/>
  <text x="330" y="153" fill="#ffffff" font-size="24" text-anchor="middle">📱</text>

  <!-- ACTION GRID: 4 KEY ACTIONS -->
  <!-- Target Action 1: SCAN ANY QR CODE (TARGET FOR STEP 2) -->
  <g id="scan_qr_box">
    <rect x="20" y="225" width="170" height="110" rx="16" fill="#0b57d0"/>
    <circle cx="55" cy="265" r="22" fill="#ffffff"/>
    <!-- QR Scanner Icon inside circle -->
    <path d="M 47 257 L 53 257 M 47 257 L 47 263 M 63 257 L 57 257 M 63 257 L 63 263 M 47 273 L 47 267 M 47 273 L 53 273 M 63 273 L 63 267 M 63 273 L 57 273" 
          stroke="#0b57d0" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="52" y="262" width="6" height="6" fill="#0b57d0"/>
    <text x="36" y="312" fill="#ffffff" font-size="16" font-weight="700">Scan any</text>
    <text x="36" y="328" fill="#ffffff" font-size="16" font-weight="700">QR code</text>
  </g>

  <!-- Action 2: Pay contacts -->
  <rect x="210" y="225" width="170" height="110" rx="16" fill="#2d2d2d"/>
  <circle cx="245" cy="265" r="22" fill="#3c4043"/>
  <text x="245" y="272" fill="#ffffff" font-size="18" text-anchor="middle">👥</text>
  <text x="226" y="312" fill="#e3e3e3" font-size="16" font-weight="600">Pay</text>
  <text x="226" y="328" fill="#e3e3e3" font-size="16" font-weight="600">contacts</text>

  <!-- Action 3: Pay phone number -->
  <rect x="20" y="350" width="170" height="100" rx="16" fill="#2d2d2d"/>
  <circle cx="55" cy="385" r="20" fill="#3c4043"/>
  <text x="55" y="392" fill="#ffffff" font-size="17" text-anchor="middle">📞</text>
  <text x="36" y="430" fill="#e3e3e3" font-size="15" font-weight="600">Pay phone</text>
  <text x="36" y="445" fill="#e3e3e3" font-size="15" font-weight="600">number</text>

  <!-- Action 4: Bank transfer -->
  <rect x="210" y="350" width="170" height="100" rx="16" fill="#2d2d2d"/>
  <circle cx="245" cy="385" r="20" fill="#3c4043"/>
  <text x="245" y="392" fill="#ffffff" font-size="17" text-anchor="middle">🏦</text>
  <text x="226" y="430" fill="#e3e3e3" font-size="15" font-weight="600">Bank</text>
  <text x="226" y="445" fill="#e3e3e3" font-size="15" font-weight="600">transfer</text>

  <!-- People / Recent section -->
  <text x="24" y="490" fill="#ffffff" font-size="17" font-weight="700">People</text>
  
  <circle cx="58" cy="535" r="24" fill="#ea4335"/>
  <text x="58" y="542" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">R</text>
  <text x="58" y="575" fill="#c4c7c5" font-size="12" text-anchor="middle">Ramesh</text>

  <circle cx="140" cy="535" r="24" fill="#34a853"/>
  <text x="140" y="542" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">P</text>
  <text x="140" y="575" fill="#c4c7c5" font-size="12" text-anchor="middle">Pooja</text>

  <circle cx="222" cy="535" r="24" fill="#fabc05"/>
  <text x="222" y="542" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">M</text>
  <text x="222" y="575" fill="#c4c7c5" font-size="12" text-anchor="middle">Milkman</text>

  <circle cx="304" cy="535" r="24" fill="#4285f4"/>
  <text x="304" y="542" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">K</text>
  <text x="304" y="575" fill="#c4c7c5" font-size="12" text-anchor="middle">Kirana</text>

  <!-- Check Balance pill at bottom -->
  <rect x="20" y="660" width="360" height="54" rx="16" fill="#2d2d2d" stroke="#3c4043" stroke-width="1.5"/>
  <text x="50" y="694" fill="#ffffff" font-size="16" font-weight="600">Check bank balance</text>
  <text x="350" y="694" fill="#a8c7fa" font-size="18" text-anchor="middle">➔</text>
</svg>

