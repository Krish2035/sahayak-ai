<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 750" width="100%" height="100%" style="background:#0b0f14; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Clock Header -->
  <rect x="0" y="0" width="400" height="70" fill="#111827"/>
  <text x="24" y="44" fill="#ffffff" font-size="22" font-weight="800">એલાર્મ (Alarm) ⏰</text>
  <text x="365" y="44" fill="#ffffff" font-size="22" text-anchor="middle">⋮</text>

  <!-- Big Digital Time Picker Box -->
  <rect x="20" y="90" width="360" height="200" rx="24" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  
  <text x="120" y="205" fill="#10b981" font-size="76" font-weight="800" text-anchor="middle">06</text>
  <text x="175" y="195" fill="#10b981" font-size="64" font-weight="700">:</text>
  <text x="235" y="205" fill="#10b981" font-size="76" font-weight="800" text-anchor="middle">00</text>
  
  <!-- AM / PM Toggle (TARGET x: 80%, y: 22%) -->
  <rect x="290" y="140" width="70" height="38" rx="10" fill="#10b981"/>
  <text x="325" y="165" fill="#0b0f14" font-size="16" font-weight="800" text-anchor="middle">AM (સવાર)</text>
  <rect x="290" y="185" width="70" height="34" rx="10" fill="#374151"/>
  <text x="325" y="208" fill="#9ca3af" font-size="14" font-weight="600" text-anchor="middle">PM</text>

  <!-- Day Selector Circles -->
  <text x="24" y="325" fill="#9ca3af" font-size="15" font-weight="700">દિવસો પુનરાવર્તિત કરો:</text>
  <g transform="translate(18, 345)">
    <!-- Sun -->
    <circle cx="24" cy="24" r="20" fill="#10b981"/>
    <text x="24" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">રવિ</text>
    <!-- Mon -->
    <circle cx="75" cy="24" r="20" fill="#10b981"/>
    <text x="75" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">સોમ</text>
    <!-- Tue -->
    <circle cx="126" cy="24" r="20" fill="#10b981"/>
    <text x="126" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">મંગળ</text>
    <!-- Wed -->
    <circle cx="177" cy="24" r="20" fill="#10b981"/>
    <text x="177" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">બુધ</text>
    <!-- Thu -->
    <circle cx="228" cy="24" r="20" fill="#10b981"/>
    <text x="228" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">ગુરુ</text>
    <!-- Fri -->
    <circle cx="279" cy="24" r="20" fill="#10b981"/>
    <text x="279" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">શુક્ર</text>
    <!-- Sat -->
    <circle cx="330" cy="24" r="20" fill="#10b981"/>
    <text x="330" y="30" fill="#0b0f14" font-size="14" font-weight="bold" text-anchor="middle">શનિ</text>
  </g>

  <!-- Alarm Ringtone & Vibration -->
  <rect x="20" y="420" width="360" height="60" rx="14" fill="#1f2937"/>
  <text x="40" y="456" font-size="20">🔔</text>
  <text x="75" y="455" fill="#ffffff" font-size="16" font-weight="700">રીંગટોન: ભક્તિ સૂર્યોદય ધૂન</text>

  <rect x="20" y="495" width="360" height="60" rx="14" fill="#1f2937"/>
  <text x="40" y="531" font-size="20">📳</text>
  <text x="75" y="530" fill="#ffffff" font-size="16" font-weight="700">વાઇબ્રેશન: ચાલુ (On)</text>

  <!-- Big Green Save Button (TARGET x: 50%, y: 88%) -->
  <g id="save_alarm_btn">
    <rect x="25" y="635" width="350" height="58" rx="29" fill="#10b981" filter="drop-shadow(0 4px 14px rgba(16,185,129,0.4))"/>
    <text x="200" y="671" fill="#0b0f14" font-size="19" font-weight="800" text-anchor="middle">💾 એલાર્મ સેવ કરો (Save Alarm)</text>
  </g>
</svg>

